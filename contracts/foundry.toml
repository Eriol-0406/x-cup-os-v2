[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
# 0.8.26 + cancun required for Uniswap V4 (uses transient storage TSTORE/TLOAD).
# XCupMarket.sol declares ^0.8.24 — forward-compatible at this level.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
xlayer_testnet = "${XLAYER_TESTNET_RPC}"

[etherscan]
xlayer_testnet = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/xlayer-test" }
